services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATA_SOURCE=csv
      - DATABASE_URL=sqlite:///./data/app.db
      # Postgres (закомментировано для локального демо — раскомментируйте и поднимите db):
      # - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/app
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # База данных сообщений/настроек (опция; SQLite по умолчанию покрывает демо).
